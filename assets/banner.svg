<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Adam Piotrowski - SEO, content and automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120a24"/>
      <stop offset="0.55" stop-color="#281C52"/>
      <stop offset="1" stop-color="#3b1f6b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(150 70) rotate(18) scale(440 330)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D0B8FB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#D0B8FB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(1070 270) rotate(-150) scale(380 300)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow1)"/>
  <rect width="1200" height="320" fill="url(#glow2)"/>

  <g font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <text x="80" y="112" fill="#D0B8FB" font-size="18" font-weight="600" letter-spacing="5">SEO · CONTENT · AUTOMATION</text>
    <text x="80" y="192" fill="#ffffff" font-size="64" font-weight="700" letter-spacing="-1">Adam Piotrowski</text>
    <rect x="82" y="215" width="112" height="4" rx="2" fill="#D0B8FB" opacity="0.9"/>
    <text x="80" y="258" fill="#d7cdec" font-size="21" font-weight="400">I build open-source tools for search, focus, and the everyday web.</text>
    <text x="80" y="288" fill="#a99bc7" font-size="16" font-weight="500" letter-spacing="1">piotrowskiadam.pl · github.com/piotrowskiadam</text>
  </g>

  <g fill="none" stroke="#D0B8FB" stroke-opacity="0.35">
    <circle cx="1040" cy="120" r="86"/>
    <circle cx="1040" cy="120" r="58"/>
    <circle cx="1040" cy="120" r="30"/>
  </g>
  <g fill="#D0B8FB">
    <circle cx="1040" cy="62" r="4"/>
    <circle cx="1098" cy="120" r="4"/>
    <circle cx="1040" cy="178" r="4"/>
    <circle cx="982" cy="120" r="4"/>
  </g>
</svg>
